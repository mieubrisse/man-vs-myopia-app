services:
  # NOTE: This is just a shell; all the actual configuration happens in the devcontainer.json
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://vision_user:vision_password@postgres:5432/vision_app
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vision_app
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: vision_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_user -d vision_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
